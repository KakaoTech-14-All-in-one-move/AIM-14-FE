server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 클라이언트 요청 본문 크기 제한
    client_max_body_size 10M;

    # 버퍼 설정 추가
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # keepalive 설정 추가
    keepalive_timeout 300s;
    keepalive_requests 1000;

    # SPA 라우팅 설정 (기존과 동일)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 기존 add_header 설정들을 location 블록 안으로 이동
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "script-src 'self' 'nonce-unique-nonce-value' 'unsafe-inline'; object-src 'none'; base-uri 'self';" always;
    }

    # 정적 파일 캐싱 설정 개선
    location ~* \.(svg|png|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    # gzip 설정 개선
    gzip on;
    gzip_vary on;  # Vary: Accept-Encoding 헤더 추가
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;
    gzip_min_length 1000;

    # 오류 페이지 설정 추가
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    # 요청 및 오류 로그 설정
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
}